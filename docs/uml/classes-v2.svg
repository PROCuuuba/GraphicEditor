<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1670" viewBox="0 0 1480 1670" role="img" aria-labelledby="title desc">
  <title id="title">UML основных классов GraphicEditor 0.2.0</title>
  <desc id="desc">Shape реализуют Polygon и абстрактный ShapeDecorator. Декоратор хранит Shape, Fill, Border и Shadow наследуют ShapeDecorator. DrawingModel хранит Shape и Pixel. VectorRenderer реализует ShapeRenderer. Растровые классы наследуют Pixel и создаются подклассами PixelFactory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker>
    <marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#fff" stroke="#475569"/></marker>
    <marker id="aggregate" viewBox="0 0 14 12" refX="1" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 6 L7 1 L13 6 L7 11Z" fill="#fff" stroke="#475569"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:17px}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:15px;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:1.5;rx:8}.interface{fill:#eff6ff}.abstract{fill:#faf5ff}.edge{fill:none;stroke:#475569;stroke-width:2}.uses{marker-end:url(#arrow)}.realizes{stroke-dasharray:7 5;marker-end:url(#inherit)}.inherits{marker-end:url(#inherit)}.aggregation{marker-start:url(#aggregate)}.line{stroke:#94a3b8}</style>
  </defs>
  <rect width="1480" height="1670" fill="#f8fafc"/>
  <text x="30" y="43" class="title">UML классов — версия 0.2.0</text>
  <text x="30" y="72" class="small">Основная объектная модель и контракты. Детальные UI-связи и редактируемый полный граф — в classes-v2.md.</text>
