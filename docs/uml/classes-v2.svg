  <text x="438" y="791">− color: Color</text><path d="M420 805 H750" class="line"/><text x="438" y="832">+ getColor(): Color</text><text x="438" y="865">+ render(ShapeRenderer)</text>
  <rect x="790" y="715" width="330" height="225" class="box"/>
  <text x="955" y="748" text-anchor="middle" class="head">BorderDecorator</text><path d="M790 762 H1120" class="line"/>
  <text x="808" y="791">− color: Color</text><text x="808" y="818">− width: double</text><path d="M790 833 H1120" class="line"/>
  <text x="808" y="860">+ getColor(): Color</text><text x="808" y="887">+ getWidth(): double</text><text x="808" y="919">+ render(ShapeRenderer)</text>
  <rect x="1130" y="715" width="330" height="225" class="box"/>
  <text x="1295" y="748" text-anchor="middle" class="head">ShadowDecorator</text><path d="M1130 762 H1460" class="line"/>
  <text x="1148" y="791">− color: Color</text><text x="1148" y="818">− offsetX, offsetY, blur: double</text><path d="M1130 833 H1460" class="line"/>
  <text x="1148" y="860">+ getColor(): Color</text><text x="1148" y="887">+ getOffsetX/Y(); getBlur()</text><text x="1148" y="919">+ render(ShapeRenderer)</text>
  <rect x="30" y="835" width="340" height="240" class="box"/>
  <text x="200" y="860" text-anchor="middle" class="small">«record»</text><text x="200" y="889" text-anchor="middle" class="head">VectorStyle</text><path d="M30 902 H370" class="line"/>
  <text x="48" y="929" class="small">флаги, цвета и параметры эффектов</text><path d="M30 944 H370" class="line"/>
  <text x="48" y="976">+ decorate(Shape): Shape</text><text x="48" y="1009">+ static from(Shape): VectorStyle</text><text x="48" y="1042">+ static geometryOf(Shape): Polygon</text>
  <text x="440" y="977" class="small">decorate() создаёт обёртки.</text>
  <text x="440" y="1028" class="small">Контроллер заменяет фигуру в модели.</text>
  <text x="440" y="1088" class="small">Холст вызывает Shape.render().</text>
  <path d="M30 1120 H1460" stroke="#cbd5e1"/>
  <text x="30" y="1160" class="head">Сохранённая растровая модель первого инкремента</text>
  <path d="M200 1430 V1400 H570" class="edge"/>
  <path d="M570 1430 V1355" class="edge inherits"/>
  <path d="M940 1430 V1400 H570" class="edge"/>
  <path d="M1310 1430 V1355" class="edge inherits"/>
  <path d="M1120 1273 H755" class="edge uses"/><text x="865" y="1256" class="small">create() → Pixel</text>
  <rect x="30" y="1215" width="340" height="140" class="box"/>
  <text x="200" y="1248" text-anchor="middle" class="head">EditorController</text><path d="M30 1263 H370" class="line"/>
  <text x="48" y="1292">+ beginStroke(x, y): List&lt;Pixel&gt;</text><text x="48" y="1323">+ continueStroke(x, y): List&lt;Pixel&gt;</text>
  <rect x="400" y="1215" width="355" height="140" class="box abstract"/>
  <text x="577" y="1240" text-anchor="middle" class="small">«abstract»</text><text x="577" y="1268" text-anchor="middle" class="head">Pixel</text><path d="M400 1281 H755" class="line"/>
  <text x="418" y="1311">координаты, размер, цвет</text><text x="418" y="1340">+ render(PixelRenderer): void</text>
  <rect x="1120" y="1215" width="340" height="140" class="box abstract"/>
  <text x="1290" y="1240" text-anchor="middle" class="small">«abstract»</text><text x="1290" y="1268" text-anchor="middle" class="head">PixelFactory</text><path d="M1120 1281 H1460" class="line"/>
  <text x="1138" y="1311">+ create(x, y, size, color): Pixel</text><text x="1138" y="1340">+ static forTool(Tool): PixelFactory</text>
  <rect x="30" y="1430" width="340" height="65" class="box"/><text x="200" y="1469" text-anchor="middle" class="head">Point</text>
  <rect x="400" y="1430" width="355" height="65" class="box"/><text x="577" y="1469" text-anchor="middle" class="head">Circle</text>
  <rect x="790" y="1430" width="310" height="65" class="box"/><text x="945" y="1469" text-anchor="middle" class="head">Square</text>
  <rect x="1120" y="1430" width="340" height="90" class="box"/><text x="1290" y="1462" text-anchor="middle" class="head">PointFactory / CircleFactory</text><text x="1290" y="1493" text-anchor="middle" class="head">SquareFactory</text>
  <text x="30" y="1555" class="small">DrawingModel хранит List&lt;Pixel&gt;. EditorController выбирает PixelFactory.forTool(Tool), создаёт Pixel и добавляет его в модель.</text>
  <text x="30" y="1584" class="small">DrawingCanvas реализует PixelRenderer. Point/Circle/Square передают ему отображение через render(PixelRenderer).</text>
  <text x="30" y="1625" class="small">△ сплошная линия — наследование; △ пунктир — реализация интерфейса; ◇ — ссылка на содержимое; → — использование.</text>
  <text x="30" y="1652" class="small">Пропущены конструкторы, часть getters, стандартные типы JavaFX и вспомогательные методы. Все показанные методы существуют в коде.</text>
</svg>
