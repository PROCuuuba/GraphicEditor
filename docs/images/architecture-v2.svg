<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="940" viewBox="0 0 1160 940" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура GraphicEditor 0.2.0</title>
  <desc id="desc">Интерфейс управляет отдельными растровым и векторным контроллерами. Модель хранит оба вида объектов. Холст читает модель и отображает её; масштаб изменяет только представление.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:17px}.title{font-size:28px;font-weight:700}.head{font-size:20px;font-weight:700}.small{font-size:15px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:12}.ui{fill:#eff6ff;stroke:#60a5fa}.model{fill:#f0fdf4;stroke:#4ade80}.vector{fill:#faf5ff;stroke:#c084fc}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.read{stroke-dasharray:7 5}</style>
  </defs>
  <rect width="1160" height="940" fill="#f8fafc"/>
  <text x="40" y="48" class="title">GraphicEditor 0.2.0 — архитектура</text>
  <text x="40" y="76" class="small">UI → контроллеры → объекты модели; модель не зависит от UI</text>
  <path d="M580 143 V175" class="edge"/>
  <path d="M420 235 H180 V295" class="edge"/>
  <path d="M740 235 H980 V295" class="edge"/>
  <path d="M580 265 V320" class="edge"/>
  <path d="M180 375 V410" class="edge"/>
  <path d="M980 375 V410" class="edge"/>
  <path d="M180 485 V525" class="edge"/>
  <path d="M980 485 V525" class="edge"/>
  <path d="M305 335 H345 V625 H420" class="edge"/>
  <path d="M855 335 H815 V625 H740" class="edge"/>
  <path d="M420 680 H180 V615" class="edge"/>
  <path d="M740 680 H980 V615" class="edge"/>
  <path d="M580 400 V445" class="edge"/>
  <path d="M580 525 V590" class="edge read"/>
  <path d="M580 525 H700 V783 H830" class="edge"/>
  <path d="M855 570 H810 V783 H830" class="edge"/>
  <path d="M980 821 V845 H580" class="edge"/>
  <rect x="420" y="95" width="320" height="48" class="box ui"/>
  <text x="580" y="126" text-anchor="middle" class="head">GraphicsEditorApplication</text>
  <rect x="420" y="175" width="320" height="90" class="box ui"/>
  <text x="580" y="208" text-anchor="middle" class="head">EditorPane</text>
  <text x="580" y="238" text-anchor="middle">инструменты, свойства, события</text>
  <rect x="55" y="295" width="250" height="80" class="box"/>
  <text x="180" y="327" text-anchor="middle" class="head">EditorController</text>
  <text x="180" y="355" text-anchor="middle">штрихи и параметры кисти</text>
  <rect x="855" y="295" width="250" height="80" class="box vector"/>
  <text x="980" y="327" text-anchor="middle" class="head">PolygonController</text>
  <text x="980" y="355" text-anchor="middle">черновик, выбор, вершины</text>
  <rect x="420" y="320" width="320" height="80" class="box ui"/>
  <text x="580" y="352" text-anchor="middle" class="head">CanvasViewport</text>
  <text x="580" y="379" text-anchor="middle">ScrollPane + Scale, авто-вписать</text>
  <rect x="55" y="410" width="250" height="75" class="box"/>
  <text x="180" y="441" text-anchor="middle" class="head">PixelFactory</text>
  <text x="180" y="468" text-anchor="middle">Point / Circle / Square Factory</text>
  <rect x="855" y="410" width="250" height="75" class="box vector"/>
  <text x="980" y="441" text-anchor="middle" class="head">VectorStyle</text>
  <text x="980" y="468" text-anchor="middle">создаёт цепочку декораторов</text>
  <rect x="420" y="445" width="320" height="80" class="box ui"/>
  <text x="580" y="476" text-anchor="middle" class="head">DrawingCanvas</text>
  <text x="580" y="503" text-anchor="middle">фон → Pixel → Shape → маркеры</text>
  <rect x="55" y="525" width="250" height="90" class="box model"/>
  <text x="180" y="558" text-anchor="middle" class="head">Pixel</text>
  <text x="180" y="586" text-anchor="middle">Point / Circle / Square</text>
  <rect x="855" y="525" width="250" height="90" class="box vector"/>
  <text x="980" y="556" text-anchor="middle" class="head">Shape</text>
  <text x="980" y="582" text-anchor="middle">Polygon + Fill / Border / Shadow</text>
  <text x="980" y="603" text-anchor="middle" class="small">контракт render(ShapeRenderer)</text>
  <rect x="420" y="590" width="320" height="115" class="box model"/>
  <text x="580" y="624" text-anchor="middle" class="head">DrawingModel</text>
  <text x="580" y="653" text-anchor="middle">List&lt;Pixel&gt; + List&lt;Shape&gt;</text>
  <text x="580" y="680" text-anchor="middle">логические координаты 900×650</text>
  <text x="593" y="568" class="small">читает</text>
  <text x="326" y="657" class="small">хранит</text>
  <text x="750" y="657" class="small">хранит</text>
  <rect x="830" y="745" width="290" height="76" class="box ui"/>
  <text x="975" y="775" text-anchor="middle" class="head" style="font-size:18px">DrawingCanvas.VectorRenderer</text>
  <text x="975" y="802" text-anchor="middle">private record : ShapeRenderer</text>
  <rect x="330" y="815" width="250" height="60" class="box ui"/>
  <text x="455" y="851" text-anchor="middle" class="head">GraphicsContext JavaFX</text>
  <text x="40" y="915" class="small">Сплошная стрелка: управление/использование. Пунктир: чтение модели. Масштаб не меняет геометрию.</text>
</svg>
